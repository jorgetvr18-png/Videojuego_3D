<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AR Quest · Kiss Land</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;900&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
  <style>
    :root { --mint: #3dffb0; --red: #ff2a55; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
                 font-family: 'Noto Sans JP', 'Hiragino Sans', 'Segoe UI', Arial, sans-serif; }
    video { object-fit: cover; }
    a-assets, a-assets img { display: none; }


    #hud { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; z-index: 10;
           display: flex; align-items: center; gap: 8px; padding: 7px 8px 11px; border-radius: 14px;
           background: rgba(0,0,0,.74); border: 1px solid var(--mint); backdrop-filter: blur(4px);
           box-shadow: 0 0 14px rgba(61,255,176,.45), inset 0 0 12px rgba(61,255,176,.12); }
    #hud .logo { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; }
    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; flex: 1; text-align: center; }
    .stat span { display: block; font-size: 9px; letter-spacing: .12em; color: var(--mint); opacity: .9; }
    .stat b { font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; }
    #cajaTiempo.alerta b { color: var(--red); animation: parpadeo .5s infinite alternate; }
    @keyframes parpadeo { from { opacity: 1 } to { opacity: .3 } }
    #barra { position: absolute; left: 12px; right: 12px; bottom: 3px; height: 4px; background: #10211b; border-radius: 3px; overflow: hidden; }
    #progreso { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1fc98a, var(--mint));
                box-shadow: 0 0 8px var(--mint); transition: width .25s; }
    #reiniciar { flex: none; width: 36px; height: 36px; font-size: 18px; color: var(--mint); background: transparent;
                 border: 1px solid var(--mint); border-radius: 10px; cursor: pointer; }
    #reiniciar:active { background: var(--mint); color: #000; }
    #estado { position: fixed; top: calc(84px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 10;
              padding: 6px 14px; font-size: 13px; white-space: nowrap; color: var(--mint); background: rgba(0,0,0,.75);
              border: 1px solid var(--mint); border-radius: 20px; box-shadow: 0 0 10px rgba(61,255,176,.5); }
    #estado.oculto { display: none; }

    #pantalla { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center;
                justify-content: center; text-align: center; padding: 20px 20px 70px; overflow-y: auto;
                background: radial-gradient(ellipse at 50% 28%, rgba(61,255,176,.18), transparent 62%),
                            repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, transparent 2px 4px), #030505; }
    #pantalla.oculta { display: none; }
    #pantalla .logoGrande { width: min(46vw, 200px); border-radius: 18px; box-shadow: 0 0 30px rgba(61,255,176,.55); }
    #pantalla h1 { margin: 14px 0 2px; font-size: 34px; font-weight: 900; letter-spacing: .14em; color: var(--mint);
                   text-shadow: 0 0 14px rgba(61,255,176,.8); }
    #pantalla h2 { margin: 6px 0; font-size: 26px; font-weight: 900; color: var(--mint); text-shadow: 0 0 12px rgba(61,255,176,.8); }
    #pantalla p { margin: 4px 0 12px; font-size: 15px; line-height: 1.45; color: #cfe; white-space: pre-line; max-width: 420px; }
    #icono { font-size: 54px; }
    .leyenda { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 14px; max-width: 360px; width: 100%; }
    .leyenda div { font-size: 12px; font-weight: 900; }
    .leyenda img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 2px solid var(--mint);
                   box-shadow: 0 0 10px rgba(61,255,176,.5); margin-bottom: 4px; }
    .leyenda .malo img { border-color: var(--red); box-shadow: 0 0 10px rgba(255,42,85,.6); }
    .leyenda .malo { color: var(--red); }
    .leyenda .bueno { color: var(--mint); }
    #boton { margin-top: 6px; padding: 13px 34px; font-size: 18px; font-weight: 900; letter-spacing: .12em; color: #031a10;
             background: var(--mint); border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 0 20px rgba(61,255,176,.7); }
    #boton:active { transform: scale(.96); }


    #pie { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; text-align: center; font-size: 10.5px; font-weight: 500;
           letter-spacing: .06em; line-height: 1.35; color: var(--mint); background: rgba(0,0,0,.88);
           border-top: 1px solid rgba(61,255,176,.6); padding: 7px 10px calc(7px + env(safe-area-inset-bottom));
           text-shadow: 0 0 6px rgba(61,255,176,.7); }
  </style>
</head>

    <a-marker preset="hiro" id="marcador">

    
      <a-circle position="0 0.004 0" rotation="-90 0 0" radius="1.1" color="#03100b" opacity="0.8"></a-circle>
      <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="1.04" radius-outer="1.1" material="color: #3dffb0; shader: flat"></a-ring>
      <a-ring position="0 0.011 0" rotation="-90 0 0" radius-inner="0.5" radius-outer="0.52" material="color: #1fc98a; shader: flat; opacity: 0.8; transparent: true"></a-ring>
      <a-text value="KISS LAND" position="0 0.02 1.3" rotation="-90 0 0" align="center" width="3.4" color="#3dffb0"></a-text>

     
      <a-entity id="robot" position="0 0 0" scale="0.55 0.55 0.55"
                animation="property: position; to: 0 0.08 0; dir: alternate; loop: true; dur: 900; easing: easeInOutSine">
        <a-box position="0 0.6 0" width="0.5" height="0.6" depth="0.3" color="#0b1a14" metalness="0.6"></a-box>
        <a-box position="0 0.6 0.16" width="0.3" height="0.3" depth="0.02" material="color: #3dffb0; shader: flat"></a-box>
        <a-box position="0 1.08 0" width="0.38" height="0.32" depth="0.3" color="#3dffb0"></a-box>
        <a-cone position="-0.14 1.34 0" radius-bottom="0.07" radius-top="0" height="0.16" color="#3dffb0"></a-cone>
        <a-cone position="0.14 1.34 0" radius-bottom="0.07" radius-top="0" height="0.16" color="#3dffb0"></a-cone>
        <a-sphere position="-0.09 1.1 0.16" radius="0.045" color="#000" material="shader: flat"></a-sphere>
        <a-sphere position="0.09 1.1 0.16" radius="0.045" color="#000" material="shader: flat"></a-sphere>
        <a-box position="-0.36 0.6 0" width="0.14" height="0.5" depth="0.14" color="#3dffb0"></a-box>
        <a-box position="0.36 0.6 0" width="0.14" height="0.5" depth="0.14" color="#3dffb0"></a-box>
        <a-box position="-0.13 0.15 0" width="0.17" height="0.3" depth="0.17" color="#0b1a14"></a-box>
        <a-box position="0.13 0.15 0" width="0.17" height="0.3" depth="0.17" color="#0b1a14"></a-box>
      </a-entity>

   
    </a-marker>

    <a-entity camera>
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .objetivo"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    
    const NIVELES = [
      { tiempo: 60, meta: 50,  albumes: 6, guardianes: 2 },
      { tiempo: 45, meta: 80,  albumes: 7, guardianes: 4 },
      { tiempo: 30, meta: 100, albumes: 8, guardianes: 6 }
    ];
    const ALBUMES = [
      { id: "hob", nombre: "House of Balloons", pts: 10, peso: 4 },
      { id: "thu", nombre: "Thursday",          pts: 10, peso: 4 },
      { id: "eos", nombre: "Echoes of Silence", pts: 20, peso: 2 }
    ];

    let nivel = 0, puntos = 0, tiempo = 0, total = 0, activa = false, reloj = null, hayMarcador = false;
    const $ = id => document.getElementById(id);
    const marcador = $("marcador");

    
    document.querySelectorAll("[data-src]").forEach(i => i.src = $(i.dataset.src).src);

    function leerRecord() { try { return parseInt(localStorage.getItem("arquest_record")) || 0; } catch (e) { return 0; } }
    function guardarRecord(v) {
      if (v > leerRecord()) { try { localStorage.setItem("arquest_record", v); } catch (e) {} }
      $("record").textContent = leerRecord();
    }

   
    let audio = null;
    function sonido(freq, dur = 0.15, tipo = "sine") {
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = tipo; o.frequency.value = freq; g.gain.value = 0.15;
        o.connect(g); g.connect(audio.destination);
        o.start(); o.stop(audio.currentTime + dur);
      } catch (e) {}
    }

  
    function posicionAleatoria() {
      let x, z;
      do { x = Math.random() * 1.8 - 0.9; z = Math.random() * 1.8 - 0.9; }
      while (Math.abs(x) < 0.4 && Math.abs(z) < 0.4);
      return { x, z, y: 0.35 + Math.random() * 0.45 };
    }
    function elegirAlbum() {
      const suma = ALBUMES.reduce((s, a) => s + a.peso, 0);
      let r = Math.random() * suma;
      for (const a of ALBUMES) { r -= a.peso; if (r <= 0) return a; }
      return ALBUMES[0];
    }
    function nuevo(tag, attrs) {
      const e = document.createElement(tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

   
    function crear(tipo) {
      const p = posicionAleatoria();
      const album = tipo === "album" ? elegirAlbum() : null;
      const imagen = tipo === "album" ? "#img-" + album.id : "#img-kiss";
      const color = tipo === "album" ? "#3dffb0" : "#ff2a55";

      const cont = nuevo("a-entity", {
        position: `${p.x} ${p.y} ${p.z}`,
        animation__vaiven: "property: rotation; from: 0 -25 0; to: 0 25 0; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine",
        animation__flota: `property: position; to: ${p.x} ${p.y + 0.09} ${p.z}; dir: alternate; loop: true; dur: 1100; easing: easeInOutSine`
      });
      cont.classList.add("dinamico");

      const inclinado = nuevo("a-entity", { rotation: "-35 0 0" });
      if (tipo === "guardian") {
        inclinado.setAttribute("animation__pulso", "property: scale; from: 1 1 1; to: 1.18 1.18 1.18; dir: alternate; loop: true; dur: 450");
      }
      const marco = nuevo("a-plane", { width: 0.5, height: 0.5, position: "0 0 -0.004",
        material: `shader: flat; color: ${color}; side: double` });
      const foto = nuevo("a-plane", { width: 0.42, height: 0.42,
        material: `shader: flat; src: ${imagen}; side: double` });
      [marco, foto].forEach(m => {
        m.classList.add("objetivo");
        m.addEventListener("click", () => recoger(tipo, album, cont, p));
        inclinado.appendChild(m);
      });
      cont.appendChild(inclinado);
      marcador.appendChild(cont);
    }

    function popup(texto, color, p) {
      const t = nuevo("a-text", { value: texto, color, align: "center", width: 2.6, rotation: "-35 0 0",
        position: `${p.x} ${p.y + 0.3} ${p.z}`,
        animation: `property: position; to: ${p.x} ${p.y + 0.95} ${p.z}; dur: 700; easing: easeOutQuad` });
      marcador.appendChild(t);
      setTimeout(() => t.remove(), 750);
    }

    function recoger(tipo, album, cont, p) {
      if (!activa || cont.dataset.usado) return;
      cont.dataset.usado = "1";
      if (tipo === "album") {
        puntos += album.pts; sonido(album.pts > 10 ? 1040 : 880, 0.15);
        popup("+" + album.pts, "#3dffb0", p);
      } else {
        puntos = Math.max(0, puntos - 10); sonido(150, 0.3, "sawtooth");
        popup("-10", "#ff2a55", p);
      }
      cont.remove();
      crear(tipo);
      actualizar();
      if (puntos >= NIVELES[nivel].meta) ganarNivel();
    }

    function actualizar() {
      $("nivel").textContent = nivel + 1;
      $("meta").textContent = NIVELES[nivel].meta;
      $("puntos").textContent = puntos;
      $("tiempo").textContent = tiempo;
      $("record").textContent = leerRecord();
      $("progreso").style.width = Math.min(100, puntos / NIVELES[nivel].meta * 100) + "%";
      $("cajaTiempo").classList.toggle("alerta", activa && tiempo <= 10);
    }

    function mostrar(icono, titulo, texto, boton, accion, conLeyenda) {
      const ic = $("icono");
      ic.textContent = icono; ic.style.display = icono ? "block" : "none";
      $("logoGrande").style.display = icono ? "none" : "block";
      $("titulo").textContent = titulo; $("texto").textContent = texto;
      $("leyenda").style.display = conLeyenda ? "grid" : "none";
      $("boton").textContent = boton; $("boton").onclick = accion;
      $("pantalla").classList.remove("oculta");
    }

    function iniciarNivel(n) {
      document.querySelectorAll(".dinamico").forEach(e => e.remove());
      nivel = n; puntos = 0; tiempo = NIVELES[n].tiempo; activa = true;
      for (let i = 0; i < NIVELES[n].albumes; i++) crear("album");
      for (let i = 0; i < NIVELES[n].guardianes; i++) crear("guardian");
      $("pantalla").classList.add("oculta");
      actualizar();
      clearInterval(reloj);
      reloj = setInterval(() => {
        if (!activa || !hayMarcador) return;      
        tiempo--; actualizar();
        if (tiempo <= 0) perder();
      }, 1000);
    }

    function ganarNivel() {
      activa = false;
      total += puntos + tiempo * 2;
      sonido(1100, 0.4);
      if (nivel < NIVELES.length - 1) {
        mostrar("⭐", "NIVEL " + (nivel + 1) + " COMPLETADO", "Puntos acumulados: " + total, "SIGUIENTE NIVEL", () => iniciarNivel(nivel + 1), false);
      } else {
        guardarRecord(total);
        sonido(1500, 0.6);
        mostrar("🏆", "¡VICTORIA!", "Colección completa de Kiss Land.\nPuntaje final: " + total + "\nRécord: " + leerRecord(), "JUGAR DE NUEVO", () => { total = 0; iniciarNivel(0); }, false);
      }
    }

    function perder() {
      activa = false;
      guardarRecord(total + puntos);
      sonido(120, 0.6, "square");
      actualizar();
      mostrar("💥", "SE ACABÓ EL TIEMPO", "Puntos: " + (total + puntos) + "\nRécord: " + leerRecord(), "REINTENTAR NIVEL", () => iniciarNivel(nivel), false);
    }

    marcador.addEventListener("markerFound", () => { hayMarcador = true;  $("estado").classList.add("oculto"); });
    marcador.addEventListener("markerLost",  () => { hayMarcador = false; $("estado").classList.remove("oculto"); });
    $("reiniciar").addEventListener("click", () => { total = 0; iniciarNivel(0); });
    $("boton").onclick = () => { total = 0; iniciarNivel(0); };

    $("record").textContent = leerRecord();
    $("tiempo").textContent = NIVELES[0].tiempo;
    $("meta").textContent = NIVELES[0].meta;
  </script>
</body>
