<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AR Quest - Juego 3D</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    video { object-fit: cover; }
    #panel { position: fixed; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,.75); color: #fff;
             padding: 10px 12px; border-radius: 10px; font-size: 16px; line-height: 1.5; }
    #reiniciar { margin-top: 6px; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; }
    #pantalla { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center;
                justify-content: center; text-align: center; background: rgba(10,10,30,.88); color: #fff; padding: 20px; }
    #pantalla.oculta { display: none; }
    #pantalla h1 { font-size: 34px; margin: 0 0 10px; }
    #pantalla p { font-size: 18px; margin: 4px 0 18px; white-space: pre-line; }
    #pantalla button { font-size: 20px; padding: 12px 28px; border: none; border-radius: 10px; background: #FFD700; cursor: pointer; }
    .trofeo { font-size: 70px; animation: salto 0.8s infinite alternate; }
    @keyframes salto { from { transform: translateY(0) } to { transform: translateY(-18px) } }
  </style>
</head>
<body>

  <div id="panel">
    <div>Nivel: <span id="nivel">1</span> | Meta: <span id="meta">0</span></div>
    <div>Puntos: <span id="puntos">0</span></div>
    <div>Tiempo: <span id="tiempo">0</span> s</div>
    <div>Récord: <span id="record">0</span></div>
    <button id="reiniciar">Reiniciar</button>
  </div>

  <div id="pantalla">
    <div class="trofeo" id="icono">🎮</div>
    <h1 id="titulo">AR Quest</h1>
    <p id="texto">Apunta la cámara al marcador HIRO.\nToca las monedas 🪙 (+10) y evita los enemigos 👾 (-10).</p>
    <button id="boton">Empezar</button>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;"
           renderer="logarithmicDepthBuffer: true;">

    <a-marker preset="hiro" id="marcador">

      <a-circle position="0 0.005 0" rotation="-90 0 0" radius="1.1" color="#101030" opacity="0.7"></a-circle>
      <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="1.04" radius-outer="1.1" material="color: #00ffff; shader: flat"></a-ring>

      <a-entity id="robot" position="0 0 0" scale="0.6 0.6 0.6"
                animation="property: position; to: 0 0.08 0; dir: alternate; loop: true; dur: 900; easing: easeInOutSine">
        <a-box position="0 0.6 0" width="0.5" height="0.6" depth="0.3" color="#2979ff" metalness="0.6"></a-box>
        <a-box position="0 1.08 0" width="0.38" height="0.32" depth="0.3" color="#cfd8dc"></a-box>
        <a-sphere position="-0.09 1.1 0.16" radius="0.045" color="#00e5ff" material="shader: flat"></a-sphere>
        <a-sphere position="0.09 1.1 0.16" radius="0.045" color="#00e5ff" material="shader: flat"></a-sphere>
        <a-cylinder position="0 1.32 0" radius="0.02" height="0.18" color="#cfd8dc"></a-cylinder>
        <a-sphere position="0 1.44 0" radius="0.05" color="#ff1744"></a-sphere>
        <a-box position="-0.36 0.6 0" width="0.14" height="0.5" depth="0.14" color="#cfd8dc"></a-box>
        <a-box position="0.36 0.6 0" width="0.14" height="0.5" depth="0.14" color="#cfd8dc"></a-box>
        <a-box position="-0.13 0.15 0" width="0.17" height="0.3" depth="0.17" color="#37474f"></a-box>
        <a-box position="0.13 0.15 0" width="0.17" height="0.3" depth="0.17" color="#37474f"></a-box>
      </a-entity>

    </a-marker>

    <a-entity camera>
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .objetivo"></a-entity>
    </a-entity>
    <a-light type="ambient" color="#fff" intensity="0.9"></a-light>
    <a-light type="directional" position="1 3 2" intensity="0.8"></a-light>
  </a-scene>

  <script>

    const NIVELES = [
      { tiempo: 60, meta: 50,  monedas: 6,  enemigos: 2 },
      { tiempo: 45, meta: 80,  monedas: 7,  enemigos: 4 },
      { tiempo: 30, meta: 100, monedas: 8,  enemigos: 6 }
    ];

    let nivel = 0, puntos = 0, tiempo = 0, total = 0, activa = false, reloj = null;
    const $ = id => document.getElementById(id);
    const marcador = $("marcador");


    function leerRecord() { try { return parseInt(localStorage.getItem("arquest_record")) || 0; } catch (e) { return 0; } }
    function guardarRecord(valor) {
      if (valor > leerRecord()) { try { localStorage.setItem("arquest_record", valor); } catch (e) {} }
      $("record").textContent = leerRecord();
    }

    
    let audio = null;
    function sonido(freq, dur = 0.15, tipo = "sine") {
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = tipo; o.frequency.value = freq; g.gain.value = 0.15;
        o.connect(g); g.connect(audio.destination);
        o.start(); o.stop(audio.currentTime + dur);
      } catch (e) {}
    }


    function posicionAleatoria() {
      let x, z;
      do { x = Math.random() * 1.8 - 0.9; z = Math.random() * 1.8 - 0.9; }
      while (Math.abs(x) < 0.35 && Math.abs(z) < 0.35);
      return { x, z, y: 0.35 + Math.random() * 0.5 };
    }


    function crear(tipo) {
      const p = posicionAleatoria();
      const cont = document.createElement("a-entity");
      cont.classList.add("dinamico");
      cont.setAttribute("position", `${p.x} ${p.y} ${p.z}`);
      cont.setAttribute("animation", "property: rotation; to: 0 360 0; loop: true; dur: 2500; easing: linear");

      let forma;
      if (tipo === "moneda") {
        forma = document.createElement("a-cylinder");
        forma.setAttribute("radius", "0.2");
        forma.setAttribute("height", "0.06");
        forma.setAttribute("color", "#FFD700");
        forma.setAttribute("rotation", "90 0 0");
      } else {
        forma = document.createElement("a-tetrahedron");
        forma.setAttribute("radius", "0.22");
        forma.setAttribute("color", "#d50000");
        forma.setAttribute("animation__pulso", "property: scale; from: 1 1 1; to: 1.35 1.35 1.35; dir: alternate; loop: true; dur: 450");
      }
      forma.classList.add("objetivo");
      forma.addEventListener("click", () => recoger(tipo, cont));
      cont.appendChild(forma);
      marcador.appendChild(cont);
    }

    function recoger(tipo, cont) {
      if (!activa) return;
      if (tipo === "moneda") { puntos += 10; sonido(880, 0.15); }
      else { puntos = Math.max(0, puntos - 10); sonido(150, 0.3, "sawtooth"); }
      cont.remove();
      crear(tipo);               // aparece otro en otro lugar
      actualizar();
      if (puntos >= NIVELES[nivel].meta) ganarNivel();
    }

    function actualizar() {
      $("nivel").textContent = nivel + 1;
      $("meta").textContent = NIVELES[nivel].meta;
      $("puntos").textContent = puntos;
      $("tiempo").textContent = tiempo;
      $("record").textContent = leerRecord();
    }

   
    function mostrar(icono, titulo, texto, boton, accion) {
      $("icono").textContent = icono; $("titulo").textContent = titulo;
      $("texto").textContent = texto; $("boton").textContent = boton;
      $("boton").onclick = accion;
      $("pantalla").classList.remove("oculta");
    }

   
    function iniciarNivel(n) {
      document.querySelectorAll(".dinamico").forEach(e => e.remove());
      nivel = n; puntos = 0; tiempo = NIVELES[n].tiempo; activa = true;
      for (let i = 0; i < NIVELES[n].monedas; i++) crear("moneda");
      for (let i = 0; i < NIVELES[n].enemigos; i++) crear("enemigo");
      $("pantalla").classList.add("oculta");
      actualizar();
      clearInterval(reloj);
      reloj = setInterval(() => {
        if (!activa) return;
        tiempo--; $("tiempo").textContent = tiempo;
        if (tiempo <= 0) perder();
      }, 1000);
    }

    function ganarNivel() {
      activa = false;
      total += puntos + tiempo * 2;    
      sonido(1100, 0.4);
      if (nivel < NIVELES.length - 1) {
        mostrar("⭐", "¡Nivel " + (nivel + 1) + " completado!", "Puntos acumulados: " + total, "Siguiente nivel", () => iniciarNivel(nivel + 1));
      } else {
        guardarRecord(total);
        sonido(1500, 0.6);
        mostrar("🏆", "¡VICTORIA!", "Puntaje final: " + total + "\nRécord: " + leerRecord(), "Jugar de nuevo", () => { total = 0; iniciarNivel(0); });
      }
    }

    function perder() {
      activa = false;
      guardarRecord(total + puntos);
      sonido(120, 0.6, "square");
      mostrar("💥", "¡Se acabó el tiempo!", "Puntos: " + (total + puntos) + "\nRécord: " + leerRecord(), "Reintentar nivel", () => iniciarNivel(nivel));
    }

    $("reiniciar").addEventListener("click", () => { total = 0; iniciarNivel(0); });
    $("boton").onclick = () => { total = 0; iniciarNivel(0); };
    $("record").textContent = leerRecord();
    $("tiempo").textContent = NIVELES[0].tiempo;
    $("meta").textContent = NIVELES[0].meta;
  </script>
</body>
</html>
